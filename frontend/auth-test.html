<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HS-CHEM｜Auth 測試頁</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 64px;
      line-height: 1.6;
    }
    h1 { margin-bottom: 8px; }
    .muted { opacity: .72; }
    .panel {
      border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
      border-radius: 14px;
      padding: 20px;
      margin-top: 20px;
    }
    label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
      border-radius: 10px;
      font: inherit;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: color-mix(in srgb, currentColor 7%, transparent);
      padding: 14px;
      border-radius: 10px;
      min-height: 72px;
    }
    .ok { color: #19703a; }
    .error { color: #b42318; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>HS-CHEM｜Auth 測試頁</h1>
  <p class="muted">
    僅供《高校化學前哨戰》development / test 使用。
    此頁只驗證 Supabase Auth，不處理課程作答資料。
  </p>

  <section class="panel">
    <h2>測試學生登入</h2>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" value="YHtest@gmail.com">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password"
           placeholder="請輸入測試密碼；不要提交到 GitHub">

    <div class="actions">
      <button id="signUpBtn" type="button">建立測試帳號</button>
      <button id="signInBtn" type="button">登入</button>
      <button id="signOutBtn" type="button">登出</button>
      <button id="refreshBtn" type="button">重新讀取 Session</button>
    </div>
  </section>

  <section class="panel">
    <h2>目前狀態</h2>
    <p id="status" class="muted">尚未讀取。</p>
    <pre id="output">—</pre>
  </section>

  <section class="panel">
    <h2>安全邊界</h2>
    <ul>
      <li>本頁只使用 Supabase Project URL 與 publishable key。</li>
      <li>不包含 service_role、secret key、Database password 或 access token。</li>
      <li>密碼只存在於瀏覽器輸入欄位，不會寫入此檔案。</li>
      <li>正式學生帳號與正式資料尚未啟用。</li>
    </ul>
  </section>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/+esm";

    const SUPABASE_URL = "https://ndtfapzcgxmaeqkisufz.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_y8IYtpUSp3uRbqQYYuaDKQ_BdqLb9QA";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");

    function setMessage(message, kind = "muted") {
      statusEl.className = kind;
      statusEl.textContent = message;
    }

    function showUser(user, session) {
      if (!user) {
        outputEl.textContent = "目前沒有登入使用者。";
        return;
      }

      outputEl.textContent = JSON.stringify({
        user_id: user.id,
        email: user.email,
        email_confirmed_at: user.email_confirmed_at ?? null,
        role: user.role ?? null,
        session_expires_at: session?.expires_at ?? null
      }, null, 2);
    }

    function getCredentials() {
      const email = emailEl.value.trim();
      const password = passwordEl.value;

      if (!email || !password) {
        throw new Error("請輸入 Email 與 Password。");
      }

      return { email, password };
    }

    async function refreshSession() {
      setMessage("讀取 Session 中…");
      const { data: { session }, error } = await supabase.auth.getSession();

      if (error) {
        setMessage(error.message, "error");
        outputEl.textContent = "—";
        return;
      }

      if (!session) {
        setMessage("目前未登入。");
        showUser(null, null);
        return;
      }

      const { data: { user }, error: userError } = await supabase.auth.getUser();

      if (userError) {
        setMessage(userError.message, "error");
        outputEl.textContent = "—";
        return;
      }

      setMessage("已登入。真正的 Supabase Auth User ID 如下。", "ok");
      showUser(user, session);
    }

    document.getElementById("signUpBtn").addEventListener("click", async () => {
      try {
        const { email, password } = getCredentials();
        setMessage("建立測試帳號中…");

        const { data, error } = await supabase.auth.signUp({ email, password });

        if (error) throw error;

        if (data.session) {
          setMessage("測試帳號已建立並登入。", "ok");
          showUser(data.user, data.session);
        } else {
          setMessage(
            "帳號建立請求已完成，但尚未取得 Session。若此 Project 要求 Email confirmation，請先完成確認後再登入。"
          );
          showUser(data.user, null);
        }
      } catch (error) {
        setMessage(error.message ?? String(error), "error");
      }
    });

    document.getElementById("signInBtn").addEventListener("click", async () => {
      try {
        const { email, password } = getCredentials();
        setMessage("登入中…");

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) throw error;

        setMessage("登入成功。", "ok");
        showUser(data.user, data.session);
      } catch (error) {
        setMessage(error.message ?? String(error), "error");
      }
    });

    document.getElementById("signOutBtn").addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();

      if (error) {
        setMessage(error.message, "error");
        return;
      }

      setMessage("已登出。", "ok");
      showUser(null, null);
    });

    document.getElementById("refreshBtn").addEventListener("click", refreshSession);

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        setMessage("Auth 狀態已更新：已登入。", "ok");
        showUser(session.user, session);
      } else {
        showUser(null, null);
      }
    });

    refreshSession();
  </script>
</body>
</html>
