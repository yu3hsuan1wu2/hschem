<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高校化學前哨戰｜學號登入測試</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 720px; margin: 0 auto; padding: 40px 20px 72px; line-height: 1.6; }
    .panel { border: 1px solid #d0d0d0; border-radius: 16px; padding: 22px; margin-top: 20px; }
    label { display:block; font-weight:800; margin-bottom:8px; }
    input { width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #aaa; border-radius:10px; font:inherit; }
    button { margin-top:14px; padding:11px 16px; border-radius:10px; border:1px solid #888; font:inherit; font-weight:800; cursor:pointer; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f4f4f4; color:#111; padding:14px; border-radius:10px; }
    .ok { color:#19703a; font-weight:800; }
    .error { color:#b42318; font-weight:800; }
    .muted { color:#666; }
  </style>
</head>
<body>
  <h1>高校化學前哨戰</h1>
  <p class="muted">Development / test｜學號識別模式</p>

  <section class="panel">
    <h2>學生登入</h2>
    <label for="studentId">學號</label>
    <input id="studentId" inputmode="text" autocomplete="off" placeholder="請輸入學號，例如 YHtest">
    <button id="enterBtn" type="button">進入課程</button>
    <button id="resetBtn" type="button">清除此瀏覽器測試身分</button>
  </section>

  <section class="panel">
    <h2>目前狀態</h2>
    <p id="status" class="muted">正在檢查登入狀態…</p>
    <pre id="output">—</pre>
  </section>

  <section class="panel">
    <h2>目前測試邊界</h2>
    <ul>
      <li>畫面只要求學號，不使用 Email 或 Password。</li>
      <li>Supabase 背後使用 Anonymous Auth 產生 UUID。</li>
      <li>未來 RLS 會使用 <code>auth.uid()</code>，不會拿學號或 user_metadata 當權限依據。</li>
      <li>目前同一身分只能依賴此瀏覽器保存；換裝置、清除瀏覽資料或登出後，無法只靠學號恢復同一匿名帳號。</li>
    </ul>
  </section>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/+esm";

    const SUPABASE_URL = "https://ndtfapzcgxmaeqkisufz.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_y8IYtpUSp3uRbqQYYuaDKQ_BdqLb9QA";
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const studentIdEl = document.getElementById("studentId");
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");

    function setStatus(message, kind = "muted") {
      statusEl.className = kind;
      statusEl.textContent = message;
    }

    function showSession(session, studentId) {
      if (!session?.user) {
        outputEl.textContent = "尚未建立測試身分。";
        return;
      }
      outputEl.textContent = JSON.stringify({
        student_id: studentId ?? null,
        auth_user_id: session.user.id,
        is_anonymous: session.user.is_anonymous ?? true,
        role: session.user.role ?? "authenticated"
      }, null, 2);
    }

    async function restore() {
      const savedStudentId = localStorage.getItem("hschem_student_id");
      if (savedStudentId) studentIdEl.value = savedStudentId;

      const { data: { session }, error } = await supabase.auth.getSession();
      if (error) {
        setStatus(error.message, "error");
        return;
      }

      if (session?.user) {
        setStatus("此瀏覽器已有測試身分，可直接接續。", "ok");
        showSession(session, savedStudentId);
      } else {
        setStatus("請輸入學號後進入課程。");
        showSession(null, null);
      }
    }

    document.getElementById("enterBtn").addEventListener("click", async () => {
      const studentId = studentIdEl.value.trim();
      if (!studentId) {
        setStatus("請先輸入學號。", "error");
        return;
      }

      setStatus("建立／讀取測試身分中…");
      outputEl.textContent = "—";

      const { data: { session: existingSession } } = await supabase.auth.getSession();
      const savedStudentId = localStorage.getItem("hschem_student_id");

      if (existingSession?.user && savedStudentId === studentId) {
        setStatus("登入成功：沿用此瀏覽器既有測試身分。", "ok");
        showSession(existingSession, studentId);
        return;
      }

      if (existingSession?.user && savedStudentId !== studentId) {
        await supabase.auth.signOut();
      }

      const { data, error } = await supabase.auth.signInAnonymously({
        options: {
          data: { student_id: studentId }
        }
      });

      if (error) {
        setStatus("匿名登入失敗：" + error.message, "error");
        outputEl.textContent = JSON.stringify({
          message: error.message,
          code: error.code ?? null,
          status: error.status ?? null
        }, null, 2);
        return;
      }

      localStorage.setItem("hschem_student_id", studentId);
      setStatus("登入成功。Supabase 已建立匿名 Auth UUID。", "ok");
      showSession(data.session, studentId);
    });

    document.getElementById("resetBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      localStorage.removeItem("hschem_student_id");
      studentIdEl.value = "";
      setStatus("已清除此瀏覽器的測試身分。");
      showSession(null, null);
    });

    restore();
  </script>
</body>
</html>
